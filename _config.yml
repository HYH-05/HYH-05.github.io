about_content: |
  저는 모르는 것 앞에서 멈추지 않고, 기초부터 직접 쌓아 올려 끝까지 해내는 사람입니다.

  체육특기생에서 IT 엔지니어로의 전환은 저에게 "출발점은 중요하지 않다"는 확신을 심어줬습니다. 이 태도는 실무에서도 동일하게 적용됩니다. 새로운 기술을 마주하면 공식 문서부터 읽고, 직접 테스트 환경을 구성하고, 실 서비스에 적용할 때까지 반복합니다.

  현재는 게임 회사에서 인프라 엔지니어로 근무하며, AWS 멀티 리전 인프라를 IDC로 마이그레이션하는 프로젝트를 주도했습니다. ELK 기반 보안 관제 시스템을 구축하여 분산된 로그를 통합 관리하는 환경을 만들었습니다. 또한 백업 자동화 스크립트와 모니터링 시스템을 직접 개발하고, Ansible을 도입하여 인프라 운영을 표준화했습니다.

  주로 AWS, Linux, ELK Stack, Ansible, Bash/Python, 네트워크/방화벽 기술을 다루고 있습니다.

content:
  - title: Projects
    layout: list
    content:
      - layout: left
        border: weak
        title: AWS → IDC 게임 서버 인프라 마이그레이션
        caption: 2026
        quote: >
          AWS 멀티 리전에서 운영 중인 글로벌 게임 서비스 인프라를 온프레미스(IDC)로 마이그레이션하여 운영 비용 절감 및 인프라 효율화
        description: |

          **담당 역할:** 인프라 아키텍처 설계 및 마이그레이션 총괄

          **수행 업무**
          - IDC 서버 환경 구축 및 초기 설정 (Live/QA 환경, 10대 이상)
          - AWS-IDC 하이브리드 아키텍처 설계 (AWS 잔류/IDC 이전 서버 분리 설계, 리전 간 통신 구조 및 장애 대응 방안 수립)
          - 네트워크 통신 경로 설계 및 보안 정책 수립 (방화벽 Inbound/Outbound 정책, NAT, VIP 포트포워딩, AWS Security Group)
          - AWS 인프라 구축 및 관리 (EC2, EIP, Network Firewall 비용 최적화, 미사용 리소스 정리)
          - 스토리지 비용 최적화 (S3 버킷 정리, 라이프사이클 정책 적용)
          - 모니터링 체계 구축 (Zabbix 연동)
          - 백업 자동화 시스템 구축
          - 마이그레이션 계획 수립 및 실행 (서비스 영향도 분석, 롤백 계획, 단계별 검증)

          **성과**
          - Live/QA 환경 마이그레이션 완료
          - AWS 월 운영 비용 절감 (Network Firewall 제거, 미사용 리소스 정리)
          - 하이브리드 아키텍처 구축으로 서비스 연속성 확보

          **기술 스택:** AWS (EC2, VPC, Security Group, EIP, EBS, S3, Network Firewall), IDC, FortiGate, Rocky Linux, MySQL, Bash, Zabbix, SoftEther VPN

      - layout: left
        border: weak
        title: ELK 기반 통합 로그 분석 및 보안 관제 시스템 구축
        caption: 2025
        thumbnail: images/project-elk.png
        quote: >
          IDC, 사무실 방화벽, 웹 서비스(LB, WAF) 등 분산된 인프라 환경의 로그를 중앙 집중식으로 수집하고, ELK 스택을 활용하여 보안 관제 및 트래픽 분석 체계 구축
        description: |
          <img src="images/project-elk.png" width="50%" alt="Kibana 대시보드">

          **담당 역할:** 로그 수집 파이프라인 설계 및 ELK 시스템 구축

          **수행 업무**
          - 로그 수집 파이프라인 설계 및 구축 (IDC 방화벽, 사무실 방화벽, LB, WAF 로그 실시간 수집)
          - 각 로그 소스 특성에 맞춘 Grok 필터 커스터마이징
          - GeoIP 등 보안 분석용 필드 추가를 통한 로그 정제
          - ELK 스택 구축 및 운영 (Elasticsearch, Logstash, Kibana)
          - ILM(Index Lifecycle Management) 정책 설계 및 적용 (Hot/Warm/Cold)
          - Kibana 기반 보안 이벤트 및 트래픽 시각화 대시보드 개발
          - 운영 문서화 및 팀 내 기술 공유

          **성과**
          - 분산된 보안 이벤트를 단일 화면에서 관제 가능한 통합 모니터링 환경 구축
          - 텍스트 기반 로그 분석에서 쿼리 기반 검색/필터링 체계로 전환
          - 장애 대응 시간(MTTR) 단축 및 근본 원인 분석 기반 확보

          **기술 스택:** Elasticsearch, Logstash, Kibana, Grok Filter, GeoIP, ILM, FortiGate, WAF, Load Balancer

      - layout: left
        border: weak
        title: 모니터링 통합 프로그램 개발
        link: https://github.com/HYH-05/Public/tree/main/projects/monitoring-dashboard
        link_text: GitHub
        github: HYH-05/Server-Monitoring
        caption: 2025
        thumbnail: images/project-monitoring.png
        quote: >
          중앙 집중화된 GUI 환경에서 실시간으로 관제하고, 장애 발생 시 자동으로 SMS 알림을 발송하는 통합 모니터링 시스템 구축
        description: |
          <img src="images/project-monitoring.png" width="50%" alt="모니터링 GUI">

          **담당 역할:** 시스템 설계 및 개발

          **수행 업무**
          - 여러 서비스의 포트 상태를 주기적으로 확인하고 직관적인 색상으로 GUI에 표시
          - DirectSend API 연동을 통해 장애/복구 감지 시 SMS 자동 발송
          - 서비스 및 수신자를 그룹 기반으로 관리, 모니터링 주기 및 활성화 상태 개별 제어
          - 모든 설정을 암호화하여 config.json 파일로 영구 저장

          **성과**
          - 장애 대응 시간을 극적으로 단축
          - 운영 환경 변화에 대한 대응 유연성 및 효율성
          - 운영자의 상태 파악 시간 및 피로도 최소화

          **기술 스택:** Python, GUI, API 연동, 암호화

      - layout: left
        border: weak
        title: GitLab 마이그레이션
        caption: 2025
        quote: >
          design-git, dev-git, web-git 서버의 마이그레이션 및 재설치 작업
        description: |

          **담당 역할:** 마이그레이션 수행 및 트러블슈팅

          **수행 업무**
          - design-git: 신규 서버 마이그레이션, 10G NIC 추가 후 인터페이스 문제 해결, NIC 불량 진단 및 교체
          - dev-git: OS 재설치 및 디스크 교체, PCIe Correctable Error 분석 및 ASPM 옵션 조정
          - mdadm RAID Rebuild 지연 문제 대응 (리빌딩 속도 제한 해제)
          - 예비 서버를 이용한 추가 git 환경 구축 (비상 대응)
          - 10G 네트워크 지원 완료

          **성과**
          - 개발 협업 환경의 업무 연속성 보장 및 데이터 유실 위험 해소
          - Git 작업 속도 개선으로 개발 생산성 향상
          - git 보안 취약점 대비 (버전업)

          **기술 스택:** GitLab, Linux, NIC, RAID, mdadm

      - layout: left
        border: weak
        title: IDC, S3 로그 백업 프로세스 수정
        caption: 2025
        quote: >
          전사 게임 서버의 2차 백업(게임 서버 → IDC) 및 3차 백업(IDC → S3) 프로세스 재정립 및 스크립트 고도화
        description: |

          **담당 역할:** 백업 프로세스 설계 및 스크립트 개발

          **수행 업무**
          - 기존 프로세스에서 발생한 누락된 백업 데이터 식별 및 복구 조치
          - 2차 백업 스크립트 고도화 (rsync 성공/실패 판단, 실패 시 알람 발송, 불필요 파일 제외)
          - 3차 백업 스크립트 최적화 (S3 전송 데이터 무결성 검증, zstd 고효율 압축 적용)
          - 함수 단위 모듈화 및 확장 가능한 구조로 리팩토링

          **성과**
          - 백업 장애 발생 시 대응 시간 단축
          - 데이터 유실/변조 없이 클라우드 이전 검증
          - 고효율 압축 및 불필요한 로그 제외로 비용 절감

          **기술 스택:** Bash, rsync, AWS S3, zstd

      - layout: left
        border: weak
        title: (구)게임 백업 데이터 이전 + 내부 백업 서버 교체
        caption: 2024
        quote: >
          기존 온프레미스 서버의 백업 데이터를 S3로 이전하고, 내부 백업 서버 교체
        description: |

          **담당 역할:** 데이터 이전 및 검증

          **수행 업무**
          - 원본 서버들의 백업 데이터 크기 및 구조 파악
          - AWS CLI 및 rsync 설치, 설정, 테스트
          - S3 버킷 정책(Bucket Policy) 설정
          - 트래픽 제한 및 스케줄러 활용한 데이터 전송
          - S3 데이터의 크기 및 파일 수를 원본과 비교, 랜덤 파일 다운로드 검증

          **성과**
          - (구)백업 데이터를 S3로 중앙 집중화 및 보존
          - 대용량 백업 데이터를 중단 없이 안전하게 S3로 이전 완수
          - 정리된 서버의 재활용 가능

          **기술 스택:** AWS CLI, AWS S3, rsync

      - layout: left
        border: weak
        title: Ansible 도입
        caption: 2025
        quote: >
          Ansible과 Semaphore 도입을 통해 코드형 인프라(IaC) 원칙을 조직의 운영 방식에 통합
        description: |

          **담당 역할:** IaC 도입 및 자동화 구축

          **수행 업무**
          - 자동화 목표 및 범위 정의 (수동 작업 목록화, PoC 선정)
          - Ansible R&D (반복문, 조건문, 핸들러, 롤, 인프라 구성 자동화)
          - 보안설정 자동화 (패스워드 정책, 디렉터리/파일 접근 권한)
          - 시스템 모니터링 자동화 (CPU, 메모리, 디스크 사용률)
          - Semaphore UI 연동

          **성과**
          - 엔지니어의 반복적인 수동 작업 부담 제거
          - Human Error 가능성 현저히 낮춰 시스템 안정성 극대화
          - 인프라 보안 수준의 균일한 유지 및 설정 이력 추적(Audit Trail) 확보

          **기술 스택:** Ansible, Semaphore, Git, IaC

