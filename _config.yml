about_profile_image: images/profile.jpg
about_content: |
  현재 게임 회사에서 Ubuntu·Rocky Linux 등 Linux 배포판과 Windows Server를 운영하고 있습니다. 국내외 게임 서비스의 AWS·IDC 하이브리드 인프라를 담당하며 정기 점검, 유지보수와 장애 대응을 수행하고 있습니다.

  AWS 멀티 리전 게임 서비스의 IDC 이전을 주도해 AWS 운영 비용을 50% 이상 절감했습니다. 전체 프로젝트에 Ansible을 적용해 서비스 설정 파일 배포와 하드웨어 점검을 자동화하고, 점검·배포 업무 시간을 70% 이상 단축했습니다.

  백업 프로세스를 개선해 압축 파일 용량을 30% 줄였으며, 파일 수·크기·체크섬 검증으로 데이터 손실률 0%를 확인했습니다. ELK로 보안 로그를 통합하고 웹 공격·VPN 로그인 시도 탐지와 ElastAlert 연계 자동 차단도 구현했습니다.

  장애가 발생하면 지표와 로그로 영향 범위를 파악하고 관련 부서와 복구를 진행합니다. 새로운 기술과 변경 작업은 공식 문서와 기존 구성을 확인하고 테스트한 뒤 운영 환경에 적용합니다.

content:
  - title: Career
    layout: list
    content:
      - layout: left
        title: (주)마상소프트
        sub_title: Infrastructure Engineer · 대리
        caption: 2024.08 - 현재
        description: |
          게임 개발·서비스 기업에서 국내외 게임 서비스의 AWS·IDC 하이브리드 인프라를 운영하고 있습니다.

          - Ubuntu·Rocky Linux·Windows Server의 서비스 상태와 시스템 로그, CPU·메모리·디스크·RAID를 정기 점검했습니다.
          - 서버 설정 변경과 패치·보안 설정을 수행하고, 작업 전 검증과 작업 후 정상 여부를 확인했습니다.
          - 장애 발생 시 지표·로그로 원인을 분석하고 관련 부서와 복구를 진행했습니다. 조치 내용과 재발 방지 방안을 기록했습니다.
          - 정기 백업 결과와 실패 내역을 확인하고, 백업 정책·보존주기 관리와 복구 테스트를 수행했습니다.
          - VPC·서브넷·라우팅, NAT·포트포워딩·VPN과 방화벽·AWS SG·IAM 권한을 구성·운영했습니다.
          - 게임 서비스 일부 인프라를 Terraform으로 직접 구성했습니다. 기존 Git·Jenkins CI/CD 환경을 활용해 배포 작업과 변경 이력을 관리했습니다.

  - title: Projects
    layout: list
    content:
      - layout: left
        border: weak
        title: "AWS-IDC 하이브리드 아키텍처 설계 및 이전"
        caption: "2026.05 - 2026.08  |  4개월"
        description: |
          **성과:** **AWS 운영 비용을 50% 이상 절감했습니다.** Live/QA 환경을 IDC로 이전하고 AWS 잔류 시스템과 연결했으며, 모니터링과 백업을 구성했습니다.

          **담당 역할:** 인프라 아키텍처 설계, 이전 계획 수립과 마이그레이션을 주도했습니다.

          **수행 내용**

          - AWS에 남길 시스템과 IDC로 옮길 시스템을 구분하고, Live/QA 서버 구성과 시스템 간 통신 경로를 설계했습니다.
          - IDC 물리 서버와 OS를 초기 설정하고 VPN을 구축했습니다. 방화벽 Inbound/Outbound, NAT, VIP 포트포워딩과 AWS Security Group 정책을 구성했습니다.
          - 서비스 영향도를 분석해 단계별 이전·검증·롤백 절차를 준비하고 마이그레이션을 수행했습니다.
          - EC2·EIP·Network Firewall 등 AWS 리소스의 사용 현황과 비용을 점검하고 유휴 리소스를 정리했습니다.
          - S3 보관 대상을 정비하고 라이프사이클 정책을 적용했습니다. 이전 서버를 Zabbix에 연동하고 백업을 자동화했습니다.

          **활용 기술:** AWS EC2·VPC·SG·EIP·EBS·S3·Network Firewall, IDC, FortiGate, Rocky Linux, SoftEther VPN, Zabbix

      - layout: left
        border: weak
        title: "Ansible·Semaphore 기반 서버 구성 자동화"
        caption: "2025.09 - 2025.12  |  4개월"
        description: |
          **성과:** **전체 프로젝트에 Ansible을 적용해 점검·배포 업무 시간을 70% 이상 단축했습니다.** Zabbix·SQL 관련 서비스·기타 에이전트의 설정 파일 배포와 하드웨어 점검을 자동화했습니다.

          **담당 역할:** 자동화 대상 선정, PoC, 구성 코드 작성과 실행 환경 연계를 담당했습니다.

          **수행 내용**

          - 패스워드 정책, 파일·디렉터리 접근 권한, CPU·메모리·디스크 점검을 Ansible로 구현하고 Semaphore UI와 연계했습니다.
          - Zabbix, SQL 관련 서비스와 기타 에이전트의 config·설정 파일을 자동 배포하고 Git으로 변경 이력을 관리했습니다.
          - 하드웨어 점검을 자동화해 반복적인 서버 확인 작업을 줄였습니다.
          - 조건문·반복문·핸들러·롤을 활용해 반복 작업을 구성했습니다.

          **활용 기술:** Ansible, Semaphore, Git

      - layout: left
        border: weak
        title: "GitLab 정기 마이그레이션 및 운영 장애 대응"
        caption: "2025년 - 현재  |  주기적 수행"
        description: |
          **성과:** 버전 업을 포함한 주기적 마이그레이션과 서버 장애 조치로 개발 협업 환경의 가용성을 유지했습니다. 비상 대응용 Git 환경도 구축했습니다.

          **담당 역할:** GitLab 버전 업·서버 이전과 하드웨어·OS 장애 분석 및 조치를 담당했습니다.

          **수행 내용**

          - GitLab 버전 업과 서버 마이그레이션을 주기적으로 수행했습니다.
          - NIC 인터페이스 문제를 분석해 불량 장비를 교체하고 OS 재설치와 디스크 교체를 수행했습니다.
          - PCIe Correctable Error에 대해 ASPM 옵션을 조정하고 mdadm RAID 리빌드 속도 제한을 조정했습니다.

          **활용 기술:** GitLab, Linux, NIC, RAID, mdadm

      - layout: left
        border: weak
        title: "IDC·S3 백업 프로세스 개선"
        caption: "2025년 1-2분기"
        description: |
          **성과:** **개선 전 대비 압축 파일 용량을 30% 줄이고 데이터 손실률 0%를 달성했습니다.** 누락된 백업 데이터를 식별·복구하고, 2차 백업의 전송 결과 확인·실패 알림과 3차 백업의 무결성 검증을 보완했습니다.

          **담당 역할:** 백업 프로세스 정비, 자동화 스크립트 개발과 전송 결과 검증을 담당했습니다.

          **수행 내용**

          - 서버 → IDC의 2차 백업과 IDC → S3의 3차 백업을 점검하고, 누락 데이터 복구와 백업 절차 보완을 수행했습니다.
          - rsync 성공·실패 판정과 실패 알림을 구현하고 전송 대상에서 불필요 파일을 제외했습니다.
          - 전송 전후 파일 수·크기·체크섬을 모두 검증해 데이터 누락과 손상 여부를 확인했습니다. 스크립트는 함수 단위로 정리했습니다.

          **활용 기술:** Bash, rsync, AWS S3, zstd

      - layout: left
        border: weak
        title: "서비스 상태 모니터링 통합 프로그램 개발"
        caption: "2025년"
        thumbnail: images/project-monitoring.png
        description: |
          **성과:** 서비스 상태를 직관적인 GUI와 SMS·전화 알림으로 전달해 장애 대응 시간을 단축했습니다. Zabbix·Grafana 사용이 익숙하지 않은 타 부서 구성원도 상태를 확인하고 알림을 받을 수 있도록 구성했습니다.

          **담당 역할:** Python 프로그램 설계·개발, 상태 점검과 SMS·전화 알림 연동을 담당했습니다.

          **수행 내용**

          - 서비스별 포트 상태를 주기적으로 확인해 GUI에 표시하고 DirectSend API로 장애·복구 SMS를 발송했습니다.
          - Amazon Connect를 연동해 전화 알림을 구현했습니다.
          - 서비스·수신자 그룹과 점검 주기·활성화 상태를 개별 관리하고, 설정을 암호화해 파일에 저장했습니다.

          **활용 기술:** Python, GUI, DirectSend API, Amazon Connect

          <img src="images/project-monitoring.png" width="50%" alt="모니터링 GUI">

          [![GitHub](https://img.shields.io/badge/🔗_GitHub-Source_Code-2ea44f?style=for-the-badge)](https://github.com/HYH-05/Public/tree/main/projects/monitoring-dashboard)

      - layout: left
        border: weak
        title: "ELK 기반 통합 로그 분석 및 보안 관제 구축"
        caption: "2024.10 - 2025.03  |  6개월"
        thumbnail: images/project-elk.png
        description: |
          **성과:** **웹 공격과 VPN 로그인 시도를 탐지하고 ElastAlert와 연계한 자동 차단을 구현했습니다.** 분산된 로그를 중앙에서 검색·분석하도록 바꿔 장애 원인 분석과 대응 시간을 단축했습니다.

          **담당 역할:** 로그 수집 파이프라인 설계, ELK 구축과 탐지·자동 차단 기능 구현을 담당했습니다.

          **수행 내용**

          - IDC·사무실 방화벽, WAF, 로드밸런서의 로그를 중앙 수집했습니다.
          - 소스별 Grok 필터를 작성하고 GeoIP 등 분석용 필드를 추가해 데이터를 정제했습니다.
          - 웹 공격과 VPN 로그인 시도를 검출하고, ElastAlert 탐지 이벤트에 연계해 자동 차단하도록 구성했습니다.
          - Kibana 보안 이벤트·트래픽 대시보드와 ILM 보관 정책을 적용하고 운영 절차와 구성 방법을 팀에 공유했습니다.

          **활용 기술:** Elasticsearch, Logstash, Kibana, ElastAlert, Grok, GeoIP, ILM, FortiGate, WAF, LB

          <img src="images/project-elk.png" width="50%" alt="Kibana 대시보드">

      - layout: left
        border: weak
        title: "구 게임 DB 데이터 S3 이전 및 서버 재사용"
        caption: "2024년"
        description: |
          **성과:** **구 게임 DB 데이터를 손실 없이 S3로 이전해 보존하고 기존 서버를 재사용했습니다.** 이전 대상 데이터를 모두 업로드한 뒤 원본과의 파일 수·크기 대조 및 표본 다운로드로 이전 결과를 검증했습니다.

          **담당 역할:** 데이터 현황 파악, 전송 환경 구성과 이전 결과 검증을 담당했습니다.

          **수행 내용**

          - AWS CLI·rsync와 S3 버킷 정책을 구성하고 트래픽 제한·스케줄러로 데이터를 전송했습니다.
          - 파일 수와 크기를 비교하고 표본 파일을 다운로드해 이전 결과를 검증했습니다.

          **활용 기술:** AWS CLI, AWS S3, rsync

