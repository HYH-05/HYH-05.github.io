  - title: Career
    layout: list
    content:
      - layout: left
        title: (주)마상소프트
        sub_title: Infrastructure Engineer · 대리
        caption: 2024.08 - 현재
        description: |
          게임 개발·서비스 기업에서 국내외 게임 서비스의 AWS·IDC 하이브리드 인프라를 운영하고 있습니다.

          - Ubuntu·Rocky Linux·Windows Server의 서비스 상태와 시스템 로그, CPU·메모리·디스크·RAID를 정기 점검했습니다.
          - 서버 설정 변경과 패치·보안 설정을 수행하고, 작업 전 검증과 작업 후 정상 여부를 확인했습니다.
          - 장애 발생 시 지표·로그로 원인을 분석하고 관련 부서와 복구를 진행했습니다. 조치 내용과 재발 방지 방안을 기록했습니다.
          - 정기 백업 결과와 실패 내역을 확인하고, 백업 정책·보존주기 관리와 복구 테스트를 수행했습니다.
          - VPC·서브넷·라우팅, NAT·포트포워딩·VPN과 방화벽·AWS SG·IAM 권한을 구성·운영했습니다.
          - Terraform으로 개인정보 처리 환경의 네트워크·서버·접근 제어를 구성하고 AWS 구축과 실환경 검증을 완료했습니다. Linux 초기 설정과 데이터 디스크 연결·보존 절차를 자동화했습니다.
          - 기존 Git·Jenkins CI/CD 환경을 활용해 배포 작업과 변경 이력을 관리했습니다.

  - title: Projects
    layout: list
    content:
      - layout: left
        border: weak
        title: "Terraform 기반 개인정보 처리 환경 분리"
        caption: "AWS 구축·실환경 검증 완료"
        description: |
          **성과:** 개인정보 처리 서비스·운영 관리 도구·QA를 각각 독립된 VPC로 분리하고 AWS 구축과 실환경 검증을 완료했습니다. 네트워크·서버·접근 제어와 Linux 초기 설정, 데이터 디스크 처리 절차를 코드로 정의했습니다.

          **담당 역할:** 환경 분리 아키텍처 설계, Terraform 구현, 공통 초기 설정과 데이터 디스크 보호 로직 구성 및 구축·검증을 담당했습니다.

          **수행 내용**

          - 환경별 VPC·서브넷·라우팅·피어링을 구성하고, 애플리케이션·DB·운영 도구를 private 서브넷에 배치했습니다. 환경 간 통신은 필요한 연결만 역할별 보안그룹에 허용했습니다.
          - 내부 ALB에서 HTTPS를 종료하고 서비스별 대상 그룹으로 전달하도록 구성했습니다. 초기 패키지 설치용 NAT와 인터넷 송신 규칙은 선택적으로 생성·제거하도록 구현했습니다.
          - Linux 최초 부팅 시 공통 패키지·시간 동기화·호스트명·로그·통계 수집 설정을 적용하도록 자동화했습니다. 실행 로그와 완료 표시를 남기고 기존 사용자 설정을 보존했습니다.
          - 지정 EBS를 식별해 빈 디스크만 최초 포맷하고 기존 파일시스템은 재사용하도록 구성했습니다. 알 수 없는 서명이나 마운트 충돌이 확인되면 자동 변경을 중단하도록 구현했습니다.
          - 데이터 EBS의 삭제·교체 계획을 차단하고, DB 시작 조건에 데이터 마운트를 반영했습니다. 보호 설정과 백업의 역할을 구분하고 애플리케이션 설치·데이터 경로 이전은 별도 작업으로 문서화했습니다.
          - Terraform 모의 테스트와 초기 설정·디스크 보존 모의 검사를 구성하고, AWS 구축과 실환경 검증을 완료했습니다. 인프라 생성·OS 초기 설정·서비스 설치의 확인 범위를 구분했습니다.
          - 입력값 검증과 리소스 의존성을 정의하고 실제 환경값과 state·plan을 Git에서 제외했습니다. 구성 방법과 이미지 선정 근거, 별도 설치 항목을 문서화했습니다.

          **활용 기술:** Terraform, AWS VPC, EC2, EBS, ALB, Security Group, VPC Peering, Linux, Windows Server, Bash, systemd

      - layout: left
        border: weak
        title: "AI 기반 서버 점검 및 변화 분석 자동화"
        caption: "2026년 3분기 - 현재 | 개발·검증"
        description: |
          **성과:** 서버 상태 수집부터 이전 점검과의 비교, AI 분석, 종합 보고서 생성과 Slack 알림까지 자동화했습니다. 서버별 이상 징후와 우선 조치 항목을 보고서로 정리해 점검 결과를 확인할 수 있도록 구성했습니다.

          **담당 역할:** 점검 스크립트와 Ansible 수집 환경, 변화 비교 로직, AI 분석 흐름과 알림 연계를 설계·구현했습니다.

          **수행 내용**

          - Ansible과 Bash로 여러 Linux 서버의 부하·메모리·디스크·프로세스·포트·계정·시스템 로그·로그인 기록을 수집했습니다.
          - 최근 7일을 기본 점검 기간으로 설정하고, Python으로 이전 점검 원본과 비교해 디스크 사용률, 포트·계정·권한 항목, 재부팅과 오류 로그의 변화를 추출했습니다.
          - 서버별 Claude 분석을 병렬 실행하고, 원문 근거에 따라 상태 등급과 신규·지속 이상 징후, 확인 명령과 조치 권고를 작성하도록 구성했습니다.
          - 종합 분석 단계에서 서버별 결과를 모아 공통 이슈와 우선 조치 목록을 생성하고, Slack에 등급별 현황과 종합 보고서를 전달했습니다.
          - 수집 실패 시 기존 비교 기준을 유지하고 수집·분석 실패를 구분했습니다. 점검 기간·병렬도·보고서 보관 기간을 설정할 수 있도록 구현했습니다.
          - 계정 암호 해시를 마스킹하고 AI 분석 단계의 도구 사용을 제한했습니다. AI의 분석·권고와 실제 서버 조치를 분리했습니다.

          **활용 기술:** Ansible, Bash, Python, Claude Code, Linux, sysstat, Slack API

      - layout: left
        border: weak
        title: "AWS-IDC 하이브리드 아키텍처 설계 및 이전"
        caption: "2026.05 - 2026.08  |  4개월"
        description: |
          **성과:** **AWS 운영 비용을 50% 이상 절감했습니다.** 주요 운영 환경을 IDC로 이전하고 필요한 서버는 AWS에 신규 구성했습니다. IDC와 AWS는 NAT·포트포워딩 및 접근 제어 정책을 적용한 공인 통신으로 연결했습니다.

          **담당 역할:** 인프라 아키텍처 설계, 이전 계획 수립과 마이그레이션을 주도했습니다.

          **수행 내용**

          - IDC 이전 대상과 AWS 신규 구성 대상을 구분하고, 서비스 간 연결 관계에 맞춰 서버 구성과 통신 경로를 설계했습니다.
          - IDC 운영 서버 환경을 구축하고 AWS에 필요한 서버를 신규 구성했습니다.
          - AWS 보안그룹을 설계·적용하고 EIP를 할당했습니다. IDC 경계의 방화벽·NAT·포트포워딩 정책을 수립하고 반영을 요청했습니다.
          - 서비스 영향도를 분석해 단계별 이전·검증·롤백 절차를 준비하고 대상 서버를 IDC로 전환했습니다.
          - 서비스 종료 환경과 유휴 리소스를 정리하고 S3 보관 정책을 정비했습니다. 모니터링과 백업도 구성했습니다.

          **활용 기술:** AWS EC2, VPC, Security Group, EIP, S3, Linux, NAT, 포트포워딩, Zabbix

      - layout: left
        border: weak
        title: "Ansible·Semaphore 기반 서버 구성 자동화"
        caption: "2025.09 - 2025.12  |  4개월"
        description: |
          **성과:** **전체 프로젝트에 Ansible을 적용해 점검·배포 업무 시간을 70% 이상 단축했습니다.** Zabbix·SQL 관련 서비스·기타 에이전트의 설정 파일 배포와 하드웨어 점검을 자동화했습니다.

          **담당 역할:** 자동화 대상 선정, PoC, 구성 코드 작성과 실행 환경 연계를 담당했습니다.

          **수행 내용**

          - 패스워드 정책, 파일·디렉터리 접근 권한, CPU·메모리·디스크 점검을 Ansible로 구현하고 Semaphore UI와 연계했습니다.
          - Zabbix, SQL 관련 서비스와 기타 에이전트의 config·설정 파일을 자동 배포하고 Git으로 변경 이력을 관리했습니다.
          - 하드웨어 점검을 자동화해 반복적인 서버 확인 작업을 줄였습니다.
          - 조건문·반복문·핸들러·롤을 활용해 반복 작업을 구성했습니다.

          **활용 기술:** Ansible, Semaphore, Git

      - layout: left
        border: weak
        title: "GitLab 정기 마이그레이션 및 운영 장애 대응"
        caption: "2025년 - 현재  |  주기적 수행"
        description: |
          **성과:** 버전 업을 포함한 주기적 마이그레이션과 서버 장애 조치로 개발 협업 환경의 가용성을 유지했습니다. 비상 대응용 Git 환경도 구축했습니다.

          **담당 역할:** GitLab 버전 업·서버 이전과 하드웨어·OS 장애 분석 및 조치를 담당했습니다.

          **수행 내용**

          - GitLab 버전 업과 서버 마이그레이션을 주기적으로 수행했습니다.
          - NIC 인터페이스 문제를 분석해 불량 장비를 교체하고 OS 재설치와 디스크 교체를 수행했습니다.
          - PCIe Correctable Error에 대해 ASPM 옵션을 조정하고 mdadm RAID 리빌드 속도 제한을 조정했습니다.

          **활용 기술:** GitLab, Linux, NIC, RAID, mdadm

      - layout: left
        border: weak
        title: "IDC·S3 백업 프로세스 개선"
        caption: "2025년 1-2분기"
        description: |
          **성과:** **개선 전 대비 압축 파일 용량을 30% 줄이고 데이터 손실률 0%를 달성했습니다.** 누락된 백업 데이터를 식별·복구하고, 2차 백업의 전송 결과 확인·실패 알림과 3차 백업의 무결성 검증을 보완했습니다.

          **담당 역할:** 백업 프로세스 정비, 자동화 스크립트 개발과 전송 결과 검증을 담당했습니다.

          **수행 내용**

          - 서버 → IDC의 2차 백업과 IDC → S3의 3차 백업을 점검하고, 누락 데이터 복구와 백업 절차 보완을 수행했습니다.
          - rsync 성공·실패 판정과 실패 알림을 구현하고 전송 대상에서 불필요 파일을 제외했습니다.
          - 전송 전후 파일 수·크기·체크섬을 모두 검증해 데이터 누락과 손상 여부를 확인했습니다. 스크립트는 함수 단위로 정리했습니다.

          **활용 기술:** Bash, rsync, AWS S3, zstd

      - layout: left
        border: weak
        title: "서비스 상태 모니터링 통합 프로그램 개발"
        caption: "2025년"
        thumbnail: images/project-monitoring.png
        description: |
          **성과:** 서비스 상태를 직관적인 GUI와 SMS·전화 알림으로 전달해 장애 대응 시간을 단축했습니다. Zabbix·Grafana 사용이 익숙하지 않은 타 부서 구성원도 상태를 확인하고 알림을 받을 수 있도록 구성했습니다.

          **담당 역할:** Python 프로그램 설계·개발, 상태 점검과 SMS·전화 알림 연동을 담당했습니다.

          **수행 내용**

          - 서비스별 포트 상태를 주기적으로 확인해 GUI에 표시하고 DirectSend API로 장애·복구 SMS를 발송했습니다.
          - Amazon Connect를 연동해 전화 알림을 구현했습니다.
          - 서비스·수신자 그룹과 점검 주기·활성화 상태를 개별 관리하고, 설정을 암호화해 파일에 저장했습니다.

          **활용 기술:** Python, GUI, DirectSend API, Amazon Connect

